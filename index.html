<!DOCTYPE html>
<html lang="en-us" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Universal LPC Sprite Sheet Character Generator</title>
	<script>
		// 移动端主题：在首次绘制前应用，避免闪白。
		// 优先读记忆；无记忆时跟随系统。桌面端通过媒体查询忽略该属性，恒为原有亮色。
		(function () {
			try {
				var theme = localStorage.getItem("lpc.mobileTheme");
				if (theme !== "light" && theme !== "dark") {
					theme = window.matchMedia &&
						window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light";
				}
				document.documentElement.setAttribute("data-theme", theme);
			} catch (e) {
				/* 隐私模式等场景忽略 */
			}
		})();
	</script>
</head>
<body data-mobile-tab="preview">
	<section id="header-left" class="sticky">
		<div class="is-flex is-align-items-center is-flex-wrap-wrap" style="gap: 1rem;">
			<h1 class="title is-4 mb-0">
				Universal LPC Spritesheet Generator
				<a href="https://github.com/liberatedpixelcup/Universal-LPC-Spritesheet-Character-Generator" class="ml-2">
					<img src="sources/github-mark.png" alt="View on GitHub" style="width:24px;height:24px;vertical-align:middle;">
				</a>
			</h1>
			<span class="subtitle is-6 mb-0 has-text-grey">
				Free/Libre pixel art from the <a href="https://lpc.opengameart.org">Liberated Pixel Cup</a>
				<span class="mx-2">|</span>
				You must <a href="#credits-section">credit the authors</a>
			</span>
			<span id="sponsors-links" class="subtitle is-6 mb-0">
				<a href="https://www.netlify.com/">Site previews by Netlify</a>
				<span class="mx-2">|</span>
				<a href="https://argos-ci.com?utm_source=LiberatedPixelCup&utm_campaign=oss">Visual testing by Argos</a>
			</span>
		</div>
	</section>

	<div id="columns-container" class="columns is-desktop">
		<div id="chooser-column" class="column">
			<div id="mithril-filters">
				<div class="box loading-shell-filters">
					<div class="category-tree-loading-host">
						<span class="loading" aria-label="Loading filters"></span>
					</div>
				</div>
			</div>
		</div>

		<div id="preview-column" class="column">
			<div id="mithril-preview">
				<div class="box loading-shell-animation">
					<span class="loading" aria-label="Loading animation preview"></span>
				</div>
			</div>
			<div id="mithril-spritesheet-preview">
				<div class="box loading-shell-spritesheet">
					<span class="loading" aria-label="Loading spritesheet preview"></span>
				</div>
			</div>
		</div>
	</div>

	<!-- 移动端外壳（底部标签栏 / 主题切换 / 停靠条按钮）。
	     仅 <1024px 可见；由 sources/components/mobile/MobileShell.ts 渲染。 -->
	<div id="mobile-shell"></div>

	<script type="module" src="sources/main.ts"></script>
</body>
</html>
